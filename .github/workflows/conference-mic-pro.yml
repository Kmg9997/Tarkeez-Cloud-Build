name: Conference Mic Pro — Android APK
on:
  push:
    branches:
      - conference-mic-pro-20261114-1
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Extract project
        run: tar -xJf ConferenceMicPro-source.tar.xz
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile APK
        run: cd ConferenceMicPro && gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ConferenceMicPro-APK
          path: ConferenceMicPro/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
